<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Master Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="spark-widget-shell">
    <div class="dashboard-container">
      <h1 class="dashboard-title">Math Master Dashboard</h1>

      <!-- Dynamic Display Area (Grid or Flashcard) -->
      <div id="display-area" class="display-area">
        <!-- Content injected by JS -->
      </div>

      <!-- Score Area -->
      <div id="score-container" class="score-container">
        <div class="score-label">SCORE</div>
        <div class="score-value" id="score-display">0/0</div>
      </div>

      <!-- Controls Area -->
      <div class="controls-grid">
        <div class="control-group">
          <label>Category</label>
          <select id="category-select" class="control-input">
            <option value="tables">Tables</option>
            <option value="squares">Squares</option>
            <option value="cubes">Cubes</option>
            <option value="fractions">Fractions</option>
          </select>
        </div>

        <div class="control-group">
          <label id="focus-label">Focus Number</label>
          <select id="focus-select" class="control-input">
            <!-- Dynamically populated by JS based on Category -->
          </select>
        </div>

        <div class="control-group">
          <label>Mode</label>
          <select id="mode-select" class="control-input">
            <option value="learning">Learning</option>
            <option value="flashcard">Flashcard (3s)</option>
            <option value="quiz">Manual Quiz</option>
          </select>
        </div>

        <div class="control-group">
          <label>Answer</label>
          <input
            type="number"
            id="answer-input"
            class="control-input"
            placeholder="Type here..."
            disabled
          />
        </div>
      </div>

      <!-- Submit Button -->
      <button id="submit-btn" class="submit-btn" disabled>Submit</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
